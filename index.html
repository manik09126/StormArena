<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Storm Arena — ডাউনলোড</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg1:#05060f;
      --bg2:#0a0f1e;
      --neon:#00f3ff;
      --accent:#9b00ff;
      --glass: rgba(255,255,255,0.05);
      --text:#e6eef7;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Poppins',sans-serif;
      background: var(--bg1);
      color:var(--text);
      padding:14px;
      overflow-x:hidden;
      position:relative;
    }

    /* Moving particle background */
    body::before{
      content:"";
      position:fixed;
      inset:0;
      background:
        radial-gradient(circle at 10% 10%, rgba(0,243,255,0.15), transparent 20%),
        radial-gradient(circle at 90% 90%, rgba(155,0,255,0.15), transparent 20%),
        repeating-linear-gradient(0deg, transparent, transparent 48px, rgba(0,243,255,0.05) 50px),
        repeating-linear-gradient(90deg, transparent, transparent 48px, rgba(155,0,255,0.05) 50px);
      animation:bgmove 20s linear infinite;
      z-index:-2;
    }
    @keyframes bgmove{
      0%{background-position:0 0,0 0,0 0,0 0;}
      100%{background-position:50px 50px, -50px -50px,100px 0,0 100px;}
    }

    /* Floating particles */
    body::after{
      content:"";
      position:fixed;
      inset:0;
      background:url('game-preview.jpg');
      opacity:0.15;
      animation:floatParticles 60s linear infinite;
      z-index:-1;
    }
    @keyframes floatParticles{
      0%{background-position:0 0;}
      100%{background-position:1000px 1000px;}
    }

    header{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      animation:float 5s ease-in-out infinite;
    }
    @keyframes float{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-5px)}
    }
    .logo{
      background:linear-gradient(135deg,var(--neon),var(--accent));
      padding:8px 12px;
      border-radius:10px;
      font-weight:700;
      font-family:'Orbitron',sans-serif;
      color:#05060f;
      font-size:14px;
      box-shadow:0 0 15px var(--neon),0 0 30px var(--accent);
    }
    header h1{
      font-size:18px;
      text-shadow:0 0 10px var(--accent);
    }
    header p{
      font-size:13px;
      color:rgba(230,238,247,0.75);
    }
    .card{
      background:rgba(255,255,255,0.02);
      border-radius:14px;
      padding:14px;
      margin-top:14px;
      display:flex;
      flex-direction:column;
      gap:14px;
      backdrop-filter:blur(6px);
      box-shadow:0 0 25px rgba(0,243,255,0.1);
      border:1px solid rgba(0,243,255,0.15);
      animation:float 6s ease-in-out infinite;
    }
    .badge{
      display:inline-block;
      background:linear-gradient(90deg,var(--accent),#4d00b5);
      padding:4px 10px;
      border-radius:999px;
      font-size:12px;
      color:#fff;
      box-shadow:0 0 8px var(--accent);
    }
    .neon{
      font-family:'Orbitron',sans-serif;
      color:var(--neon);
      text-shadow:0 0 10px var(--neon), 0 0 20px var(--neon);
      font-size:20px;
    }
    .meta{
      font-size:13px;
      color:rgba(230,238,247,0.75);
    }
    .features{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
    }
    .feature{
      background:var(--glass);
      padding:8px;
      border-radius:8px;
      font-size:12px;
      transition:0.3s;
      box-shadow:0 0 5px rgba(0,243,255,0.1);
    }
    .feature:hover{
      background:rgba(0,243,255,0.1);
      transform:scale(1.05);
      box-shadow:0 0 15px rgba(0,243,255,0.3);
    }
    .btn-download{
      display:block;
      width:100%;
      padding:12px;
      background:linear-gradient(90deg,var(--neon),var(--accent));
      color:#05060f;
      font-weight:700;
      border:none;
      border-radius:10px;
      font-size:15px;
      box-shadow:0 0 15px var(--neon), 0 0 25px var(--accent);
      position:relative;
      overflow:hidden;
      cursor:pointer;
      animation:pulseBtn 2s infinite;
    }
    @keyframes pulseBtn{
      0%{box-shadow:0 0 15px var(--neon),0 0 25px var(--accent);}
      50%{box-shadow:0 0 25px var(--neon),0 0 40px var(--accent);}
      100%{box-shadow:0 0 15px var(--neon),0 0 25px var(--accent);}
    }
    .btn-download::after{
      content:"";
      position:absolute;
      top:0;left:-75%;
      width:50%;
      height:100%;
      background:rgba(255,255,255,0.3);
      transform:skewX(-20deg);
      animation:shine 2.5s infinite;
    }
    @keyframes shine{
      0%{left:-75%;}
      100%{left:125%;}
    }
    .btn-download:hover{
      transform:scale(1.03);
    }
    .small{
      font-size:12px;
      color:rgba(230,238,247,0.7);
      margin-top:6px;
    }
    .progress{
      height:12px;
      background:rgba(255,255,255,0.03);
      border-radius:8px;
      margin-top:10px;
      position:relative;
      overflow:hidden;
    }
    .progress i{
      display:block;
      height:100%;
      width:0%;
      background:linear-gradient(270deg,var(--neon),var(--accent));
      border-radius:8px;
      animation:flow 1s linear infinite;
    }
    @keyframes flow{
      0%{background-position:0 0;}
      100%{background-position:50px 0;}
    }
    .pct{
      position:absolute;
      right:8px;
      top:-20px;
      font-size:11px;
    }
    .phone-wrap{
      width:100%;
      max-width:240px;
      margin:0 auto;
    }
    .phone{
      width:100%;
      aspect-ratio:9/18;
      border-radius:20px;
      background:linear-gradient(180deg,#0a1222,#0c142a);
      border:2px solid rgba(255,255,255,0.05);
      box-shadow:0 0 15px rgba(0,243,255,0.3);
      overflow:hidden;
      position:relative;
    }
    .bg-pulse{
      position:absolute;
      inset:0;
      background:url('game-preview.jpg') center/cover no-repeat;
      animation:scrollBg 12s linear infinite;
    }
    @keyframes scrollBg{
      0%{background-position:center top;}
      50%{background-position:center bottom;}
      100%{background-position:center top;}
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">STORM ARENA</div>
    <div>
      <h1>Storm Arena</h1>
      <p>কমপ্যাক্ট, দ্রুত ও নিরাপদ APK ডাউনলোড</p>
    </div>
  </header>

  <div class="card">
    <span class="badge">LIVE TOURNAMENT</span>
    <h2 class="neon">Storm Arena — Season 7</h2>
    <div class="meta">ফাইল সাইজ: 16 MB · Android 5.0+ · ১২ অগাস্ট ২০২৫</div>
    <p style="font-size:13px">নীচের ডাউনলোড বাটনে ট্যাপ করে APK ডাউনলোড করুন।</p>
    <div class="features">
      <div class="feature">কম-ল্যাটেন্সি ম্যাচ</div>
      <div class="feature">টুর্নামেন্ট ম্যাপ</div>
      <div class="feature">নিয়মিত আপডেট</div>
    </div>
    <button class="btn-download" id="dlBtn">ডাউনলোড (APK)</button>
    <div class="small">ফাইলটি সরাসরি সংরক্ষিত হবে।</div>
    <div class="progress">
      <i id="progressBar"></i>
      <div class="pct" id="pctText">0%</div>
    </div>
    <div class="phone-wrap">
      <div class="phone">
        <div class="bg-pulse"></div>
      </div>
    </div>
  </div>

  <script>
    const dlBtn = document.getElementById('dlBtn');
    const bar = document.getElementById('progressBar');
    const pct = document.getElementById('pctText');
    const APK_URL = 'SA.apk';
    dlBtn.addEventListener('click', function(){
      let progress = 0;
      dlBtn.disabled = true;
      dlBtn.textContent = 'ডাউনলোড শুরু...';
      const interval = setInterval(()=>{
        progress += Math.floor(Math.random()*12)+6;
        if(progress>100) progress=100;
        bar.style.width = progress + '%';
        pct.textContent = progress + '%';
        if(progress>=100){
          clearInterval(interval);
          dlBtn.textContent = 'ফাইল প্রস্তুত — ইনস্টল করুন';
          dlBtn.disabled = false;
          window.location.href = APK_URL;
        }
      }, 500);
    });
  </script>
</body>
</html>
